<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3efe8">
  <meta name="description" content="RÖ — The pRÖper fit. Minimal. Timeless. Always you.">
  <title>RÖ — The pRÖper fit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --offwhite: #f3efe8;
      --black: #111111;
      --muted: #7d776f;
      --line: rgba(17,17,17,.18);
      --max: 1280px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--offwhite);
      color: var(--black);
      font-family: "DM Sans", system-ui, sans-serif;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      min-height: 100vh;
      max-width: var(--max);
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: minmax(520px, 60vh) minmax(520px, 40vh);
      background: var(--offwhite);
    }
    .panel {
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    .text-panel {
      padding: clamp(28px, 4vw, 72px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .topline {
      display: flex;
      justify-content: space-between;
      align-items: center;
      letter-spacing: .25em;
      text-transform: uppercase;
      font-size: 11px;
      color: #4f4a44;
    }
    .menu {
      display: inline-flex;
      width: 34px;
      height: 22px;
      flex-direction: column;
      justify-content: space-between;
      padding: 2px 0;
    }
    .menu span {
      width: 26px;
      height: 1px;
      background: var(--black);
      display: block;
    }
    .brand-wrap { max-width: 520px; }
    .brand {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(92px, 13vw, 190px);
      line-height: .82;
      letter-spacing: -.06em;
      margin: 0;
      font-weight: 400;
    }
    .brand-sub {
      margin-top: 26px;
      font-size: clamp(22px, 2.3vw, 34px);
      letter-spacing: .18em;
      font-weight: 400;
    }
    .rule {
      width: 76px;
      height: 1px;
      background: var(--black);
      margin: 34px 0;
    }
    .copy {
      max-width: 180px;
      font-size: 14px;
      line-height: 2.05;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    .image-panel img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      filter: saturate(.72) contrast(.96);
    }
    .image-panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(0,0,0,.10));
      pointer-events: none;
    }
    .logo-mark {
      position: absolute;
      left: 50%;
      bottom: -34px;
      transform: translateX(-50%);
      z-index: 5;
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(110px, 16vw, 210px);
      line-height: .7;
      color: var(--offwhite);
      letter-spacing: -.08em;
      text-shadow: 0 10px 40px rgba(0,0,0,.14);
      mix-blend-mode: screen;
      pointer-events: none;
    }
    .social-panel {
      padding: clamp(36px, 5vw, 84px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .social-inner {
      width: min(560px, 100%);
    }
    .social-list {
      margin-top: 10px;
      border-top: 1px solid var(--line);
    }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 23px 0;
      border-bottom: 1px solid var(--line);
      font-size: 15px;
      letter-spacing: .28em;
      text-transform: uppercase;
      transition: transform .25s ease, opacity .25s ease;
    }
    .social-link:hover { transform: translateX(8px); opacity: .72; }
    .arrow { font-size: 23px; letter-spacing: 0; }
    .mini-copy {
      margin-top: 80px;
      max-width: 320px;
      font-size: 12px;
      line-height: 2;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: #4f4a44;
    }
    .cta {
      margin-top: 30px;
      display: inline-flex;
      align-items: center;
      gap: 36px;
      background: var(--black);
      color: #fff;
      padding: 16px 24px;
      border-radius: 999px;
      letter-spacing: .24em;
      text-transform: uppercase;
      font-size: 12px;
    }
    .footer {
      position: absolute;
      left: clamp(36px, 5vw, 84px);
      right: clamp(36px, 5vw, 84px);
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 10px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #65605a;
    }

    @media (max-width: 820px) {
      .page {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
      }
      .panel { min-height: 70vh; }
      .text-panel { min-height: 62vh; }
      .image-panel { min-height: 72vh; }
      .social-panel { min-height: 72vh; }
      .brand { font-size: clamp(86px, 24vw, 150px); }
      .logo-mark { bottom: -20px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="panel text-panel">
      <div class="topline">
        <div class="menu" aria-hidden="true"><span></span><span></span></div>
        <div>EST. 2026</div>
      </div>

      <div class="brand-wrap">
        <h1 class="brand">RÖ</h1>
        <div class="brand-sub">The pRÖper fit</div>
        <div class="rule"></div>
        <div class="copy">Minimal.<br>Timeless.<br>Always you.</div>
      </div>

      <div class="footer">
        <span>RÖ</span>
        <span>Everyday confidence.</span>
      </div>
    </section>

    <section class="panel image-panel">
      <img src="assets/model.jpg" alt="RÖ fashion campaign model in an oversized off-white hoodie">
      <div class="logo-mark">RÖ</div>
    </section>

    <section class="panel image-panel">
      <img src="assets/pants.jpg" alt="RÖ black straight-fit sweatpants detail">
    </section>

    <section class="panel social-panel" id="links">
      <div class="social-inner">
        <div class="social-list">
          <a class="social-link" href="https://www.instagram.com/rofashion.eg?igsh=MXQxdHU4bTA5YWNzcQ==" target="_blank" rel="noopener noreferrer">
            <span>Instagram</span><span class="arrow">→</span>
          </a>
          <a class="social-link" href="https://www.tiktok.com/@r.fashion43?_r=1&_t=ZS-98znHrXU1Fg" target="_blank" rel="noopener noreferrer">
            <span>TikTok</span><span class="arrow">→</span>
          </a>
          <a class="social-link" href="https://www.facebook.com/share/1Bhj9QjNDV/" target="_blank" rel="noopener noreferrer">
            <span>Facebook</span><span class="arrow">→</span>
          </a>
        </div>

        <div class="mini-copy">
          Designed for everyday.<br>
          Made to feel right.
        </div>

        <a class="cta" href="#links">Join the movement <span>→</span></a>
      </div>
    </section>
  </main>
</body>
</html>
